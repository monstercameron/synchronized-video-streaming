# HTTPS with HTTP/2 and HTTP/3. Needs a certificate for ${DOMAIN} in /etc/letsencrypt (see deploy/DOCKER.md).
# The official nginx image substitutes ${DOMAIN} from the environment when it starts.
upstream screening_app {
    server app:3000;
    keepalive 32;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/vnd.apple.mpegurl application/x-mpegurl text/vtt;

ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets on;

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic reuseport;           # HTTP/3
    listen [::]:443 quic reuseport;      # HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    quic_retry on;

    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    # No ssl_early_data: a replayed play/pause/chat request is not harmless.

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/screening-locations.conf;
}
