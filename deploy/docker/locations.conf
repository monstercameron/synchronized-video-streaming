# Mounted into the Nginx container as /etc/nginx/snippets/screening-locations.conf.
# Same as deploy/screening-locations.conf.example, with the paths of the container setup.

client_max_body_size 4g;   # Keep in step with MAX_UPLOAD_GB / MEDIA_QUOTA_GB in .env.

# Video files. The app checks the caller is in the room, then answers "X-Accel-Redirect: /_media/<file>" and Nginx sends the
# file from the shared data folder (mounted read-only at /data) and handles Range requests (seeking) itself.
location /_media/ {
    internal;
    alias /data/media/;
    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    aio threads;
    gzip off;
    add_header Accept-Ranges bytes;
}

# Live room updates: one long-lived response per viewer. Must not be buffered or compressed.
location ~ ^/api/rooms/[A-Za-z0-9_-]+/events$ {
    proxy_pass http://screening_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    tcp_nodelay on;
    proxy_read_timeout 1h;
}

# Uploads: stream to the app as the file arrives.
location ~ ^/api/rooms/[A-Za-z0-9_-]+/library/upload$ {
    proxy_pass http://screening_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location / {
    proxy_pass http://screening_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
