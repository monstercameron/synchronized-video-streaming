# Plain HTTP: works as soon as the stack is up (even by IP address) and lets Certbot prove you own the domain.
upstream screening_app {
    server app:3000;
    keepalive 32;
}

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/vnd.apple.mpegurl application/x-mpegurl text/vtt;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/screening-locations.conf;
}
